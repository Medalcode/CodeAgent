apiVersion: apps/v1
kind: Deployment
metadata:
  name: codeagent-server
  labels:
    app: codeagent
spec:
  replicas: 2
  selector:
    matchLabels:
      app: codeagent
  template:
    metadata:
      labels:
        app: codeagent
    spec:
      containers:
      - name: codeagent
        image: ghcr.io/medalcode/codeagent:latest
        ports:
        - containerPort: 8000
        envFrom:
        - configMapRef:
            name: codeagent-config
        readinessProbe:
          httpGet:
            path: /metrics
            port: 8000
          initialDelaySeconds: 5
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /metrics
            port: 8000
          initialDelaySeconds: 15
          periodSeconds: 20
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "1Gi"
            cpu: "1000m"
